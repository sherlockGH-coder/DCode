packages:
  - .

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  node-pty: true
auditConfig:
  # electron-builder 26.15.3 pins @electron/asar 3.x, whose minimatch chain
  # cannot consume brace-expansion 5.x. It only evaluates trusted build patterns;
  # remove this exception when electron-builder adopts @electron/asar 4.x.
  ignoreCves:
    - CVE-2026-14257

peerDependencyRules:
  allowedVersions:
    react-material-icon-theme>react: ^19.0.0
    react-material-icon-theme>react-dom: ^19.0.0

patchedDependencies:
  react-material-icon-theme: patches/react-material-icon-theme.patch
