<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>权限控制 - 简约交互原型</title>
  <style>
    /*
      Visual system
      Type: 13/15/20/28px using the app's native SF Pro + PingFang stack.
      Color: #F7F8FA canvas, white surfaces, #E5E7EB dividers, #147CE5 accent.
      Rhythm: 8px base unit; section labels sit outside quiet, row-based groups.
      Shape: 6px controls and 8px surfaces, with shadows reserved for overlays.
    */
    :root {
      color-scheme: light;
      --canvas: #f7f8fa;
      --sidebar: #f2f2f2;
      --surface: #ffffff;
      --surface-soft: #f5f5f7;
      --line: rgba(17, 24, 39, 0.09);
      --line-strong: rgba(17, 24, 39, 0.14);
      --text: #1d2127;
      --muted: #6f747c;
      --faint: #969ba3;
      --blue: #147ce5;
      --blue-soft: #eaf3ff;
      --amber: #b05b00;
      --amber-soft: #fff4e4;
      --red: #d8323c;
      --red-soft: #ffedef;
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: #0a0a0a; color: var(--text); }
    button, input { font: inherit; letter-spacing: 0; }
    button { color: inherit; }

    .app-window {
      width: min(1440px, calc(100vw - 48px));
      height: min(900px, calc(100vh - 48px));
      min-height: 640px;
      margin: 24px auto;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      background: var(--canvas);
      box-shadow: 0 22px 70px rgba(0,0,0,.28);
    }

    .sidebar {
      min-width: 0;
      padding: 28px 10px 20px;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--sidebar);
    }

    .traffic { display: flex; gap: 9px; padding: 0 10px 22px; }
    .traffic span { width: 12px; height: 12px; border-radius: 50%; }
    .traffic span:nth-child(1) { background: #ff5f57; }
    .traffic span:nth-child(2) { background: #febc2e; }
    .traffic span:nth-child(3) { background: #28c840; }

    .back, .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .back { height: 34px; padding: 0 8px; color: #4b5058; font-size: 14px; font-weight: 650; border-radius: 6px; }
    .back:hover { background: rgba(0,0,0,.04); }

    .search { position: relative; margin: 12px 0 22px; }
    .search svg { position: absolute; top: 9px; left: 11px; color: #969ba3; }
    .search input {
      width: 100%; height: 34px; padding: 0 12px 0 34px;
      border: 1px solid var(--line); border-radius: 7px; outline: 0;
      background: white; color: var(--text); font-size: 14px;
    }
    .search input:focus { border-color: rgba(20,124,229,.5); box-shadow: 0 0 0 3px rgba(20,124,229,.1); }

    .nav-group { margin-top: 18px; }
    .nav-group:first-of-type { margin-top: 0; }
    .nav-label { margin: 0 0 5px; padding: 0 8px; color: #8e8e93; font-size: 13px; font-weight: 650; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 9px;
      border-radius: 6px; color: #3a3a3c; font-size: 14px;
    }
    .nav-item:hover { background: rgba(0,0,0,.04); }
    .nav-item.active { background: #e2e3e5; color: #1d2127; }
    .nav-item svg { width: 17px; height: 17px; flex: none; color: #626872; }

    .main { min-width: 0; overflow: auto; background: var(--canvas); }
    .main-inner { width: min(860px, calc(100% - 64px)); margin: 0 auto; padding: 54px 0 90px; }
    .page-header { margin-bottom: 44px; }
    .page-header h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.2; font-weight: 700; }
    .page-header p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }

    .section { margin-top: 36px; }
    .section:first-of-type { margin-top: 0; }
    .section-head { min-height: 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 10px; }
    .section-head h2 { margin: 0; font-size: 15px; font-weight: 680; }
    .status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
    .status[data-tone="amber"] { color: var(--amber); }
    .status[data-tone="amber"] .status-dot { background: #f08b19; }
    .status[data-tone="red"] { color: var(--red); }
    .status[data-tone="red"] .status-dot { background: var(--red); }

    .group { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .permission-row { min-height: 76px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 28px; padding: 16px 20px; border-top: 1px solid var(--line); cursor: pointer; }
    .permission-row:first-child { border-top: 0; }
    .permission-row:hover { background: #fbfbfc; }
    .row-copy { min-width: 0; }
    .row-title { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; font-size: 14px; font-weight: 650; }
    .row-title svg { width: 17px; height: 17px; color: #717780; }
    .row-description { max-width: 610px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.48; text-wrap: pretty; }
    .radio { width: 19px; height: 19px; display: grid; place-items: center; border: 1.5px solid #a5a9b0; border-radius: 50%; background: white; }
    .radio::after { content: ""; width: 9px; height: 9px; border-radius: 50%; transform: scale(0); background: white; transition: transform 150ms ease; }
    .permission-row.selected .radio { border-color: var(--blue); background: var(--blue); }
    .permission-row.selected .radio::after { transform: scale(1); }

    .risk-row { min-height: 76px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 24px; padding: 16px 20px; }
    .risk-label { padding: 5px 9px; border-radius: 999px; background: var(--red-soft); color: var(--red); font-size: 12px; font-weight: 650; }

    .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 8px; background: #ededf0; }
    .segment { height: 38px; border: 0; border-radius: 6px; background: transparent; color: #6f747c; cursor: pointer; font-size: 13px; font-weight: 650; }
    .segment:hover { color: var(--text); }
    .segment.selected { background: white; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.09); }
    .summary { padding: 24px 20px 20px; }
    .summary h3 { margin: 0 0 5px; font-size: 16px; }
    .summary p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .capabilities { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); margin-top: 22px; border-top: 1px solid var(--line); }
    .capability { display: flex; align-items: center; gap: 9px; min-height: 44px; border-bottom: 1px solid var(--line); color: #4c525a; font-size: 13px; }
    .capability:nth-child(odd) { padding-right: 18px; }
    .capability:nth-child(even) { padding-left: 18px; border-left: 1px solid var(--line); }
    .capability svg { width: 15px; height: 15px; color: var(--blue); }

    .levels { display: grid; gap: 8px; }
    .level { position: relative; display: grid; grid-template-columns: 36px minmax(0,1fr) auto; align-items: center; gap: 14px; min-height: 82px; padding: 14px 17px; border: 1px solid var(--line); border-radius: 8px; background: white; cursor: pointer; }
    .level:hover { border-color: var(--line-strong); }
    .level.selected { border-color: rgba(20,124,229,.45); box-shadow: 0 0 0 3px rgba(20,124,229,.08); }
    .level-index { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; background: var(--surface-soft); color: #747a83; font-size: 12px; font-weight: 700; }
    .level.selected .level-index { background: var(--blue-soft); color: var(--blue); }
    .level h3 { margin: 0 0 4px; font-size: 14px; }
    .level p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }

    .prototype-switcher {
      position: fixed; z-index: 20; right: 28px; bottom: 28px; display: flex; gap: 3px; padding: 4px;
      border: 1px solid rgba(255,255,255,.18); border-radius: 8px; background: rgba(25,25,27,.94); box-shadow: 0 12px 32px rgba(0,0,0,.22);
    }
    .prototype-switcher button { width: 36px; height: 30px; border: 0; border-radius: 5px; background: transparent; color: #a9abb1; cursor: pointer; font-size: 12px; font-weight: 700; }
    .prototype-switcher button:hover { color: white; }
    .prototype-switcher button.active { background: #3a3a3e; color: white; }

    .toast { position: fixed; z-index: 40; top: 42px; left: 50%; transform: translate(-50%, -10px); padding: 8px 12px; border-radius: 7px; background: #24262a; color: white; box-shadow: 0 8px 24px rgba(0,0,0,.2); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 160ms ease, transform 160ms ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .modal-backdrop { position: fixed; z-index: 30; inset: 0; display: none; place-items: center; padding: 24px; background: rgba(10,12,16,.34); backdrop-filter: blur(2px); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(400px, 100%); padding: 22px; border: 1px solid rgba(0,0,0,.08); border-radius: 10px; background: white; box-shadow: 0 22px 70px rgba(0,0,0,.26); }
    .modal-icon { width: 34px; height: 34px; display: grid; place-items: center; margin-bottom: 16px; border-radius: 8px; background: var(--red-soft); color: var(--red); }
    .modal h3 { margin: 0 0 7px; font-size: 17px; }
    .modal p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    .modal-actions button { height: 34px; padding: 0 13px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 650; }
    .cancel { border: 1px solid var(--line); background: white; }
    .confirm { border: 1px solid var(--red); background: var(--red); color: white; }

    [data-variant="a"] .variant-b, [data-variant="a"] .variant-c,
    [data-variant="b"] .variant-a, [data-variant="b"] .variant-c,
    [data-variant="c"] .variant-a, [data-variant="c"] .variant-b { display: none; }

    @media (max-width: 760px) {
      body { background: var(--canvas); }
      .app-window { width: 100%; height: 100vh; min-height: 560px; margin: 0; grid-template-columns: 1fr; border: 0; border-radius: 0; }
      .sidebar { display: none; }
      .main-inner { width: min(100% - 32px, 600px); padding-top: 32px; }
      .page-header { margin-bottom: 32px; }
      .permission-row, .risk-row { gap: 16px; padding-inline: 16px; }
      .capabilities { grid-template-columns: 1fr; }
      .capability:nth-child(even) { padding-left: 0; border-left: 0; }
      .capability:nth-child(odd) { padding-right: 0; }
      .prototype-switcher { right: 14px; bottom: 14px; }
    }
  </style>
</head>
<body data-variant="a">
  <div class="app-window">
    <aside class="sidebar" aria-label="系统设置导航">
      <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
      <button class="back" type="button">‹&nbsp;&nbsp;返回应用</button>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="search" placeholder="搜索设置..." aria-label="搜索设置">
      </label>
      <div id="navigation"></div>
    </aside>

    <main class="main">
      <div class="main-inner">
        <header class="page-header">
          <h1>权限控制</h1>
          <p>设置 AI 执行工具和终端命令时的审批边界</p>
        </header>

        <section class="section">
          <div class="section-head">
            <h2>工具审批策略</h2>
            <span class="status" id="status"><span class="status-dot"></span><span id="status-label">默认审批</span></span>
          </div>

          <div class="variant-a group" id="rows"></div>

          <div class="variant-b group">
            <div class="segmented" id="segments"></div>
            <div class="summary" id="summary"></div>
          </div>

          <div class="variant-c levels" id="levels"></div>
        </section>

        <section class="section" id="risk-section" hidden>
          <div class="section-head"><h2>风险提示</h2></div>
          <div class="group">
            <div class="risk-row">
              <div class="row-copy">
                <div class="row-title" id="risk-title">完全访问已启用</div>
                <p class="row-description" id="risk-description">当前不会显示工具权限审批。涉及删除、安装、网络或凭据相关操作时，请确认当前环境完全可信。</p>
              </div>
              <span class="risk-label">高风险</span>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="prototype-switcher" aria-label="原型方案">
    <button type="button" class="active" data-set-variant="a" title="方案 A：参考图式行列表">A</button>
    <button type="button" data-set-variant="b" title="方案 B：紧凑分段">B</button>
    <button type="button" data-set-variant="c" title="方案 C：分级边界">C</button>
  </div>

  <div class="toast" role="status" aria-live="polite">设置已保存</div>
  <div class="modal-backdrop" id="modal" role="presentation">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-icon" aria-hidden="true">!</div>
      <h3 id="modal-title">启用完全访问？</h3>
      <p>启用后，AI 可以直接执行工具和终端命令，不再显示权限审批。请仅在完全信任的本地开发环境中使用。</p>
      <div class="modal-actions">
        <button class="cancel" id="cancel-full" type="button">取消</button>
        <button class="confirm" id="confirm-full" type="button">启用完全访问</button>
      </div>
    </div>
  </div>

  <script>
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "variant": "a",
      "mode": "default"
    }/*EDITMODE-END*/;

    const navGroups = [
      ["个人", [["外观", "panel"], ["配置", "gear"], ["语音输入", "mic"], ["网络搜索", "globe"]]],
      ["集成", [["技能", "layers"], ["MCP 服务器", "plug"]]],
      ["控制", [["权限控制", "shield"]]]
    ];

    const icon = (name) => {
      const paths = {
        panel: '<rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M10 4v16"></path>',
        gear: '<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H3v-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3h4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path>',
        mic: '<rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"></path>',
        globe: '<circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path>',
        layers: '<path d="m12 3 9 5-9 5-9-5 9-5Z"></path><path d="m3 12 9 5 9-5M3 16l9 5 9-5"></path>',
        plug: '<path d="M12 22v-5M9 8V2M15 8V2M6 8h12v3a6 6 0 0 1-12 0V8Z"></path>',
        shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path>',
        check: '<path d="m5 12 4 4L19 6"></path>',
        lock: '<rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path>'
      };
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.shield}</svg>`;
    };

    const modes = [
      { id: "default", label: "默认审批", short: "默认", tone: "blue", icon: "shield", description: "本地只读工具自动执行；bash、文件写入、联网请求和外部状态变更仍会弹窗确认。", summary: "保持明确的操作边界，在效率和控制之间取得平衡。", capabilities: ["读取与搜索自动执行", "文件写入需要确认", "终端命令需要确认", "联网与外部变更需要确认"] },
      { id: "auto_review", label: "文件操作自动放行", short: "文件", tone: "amber", icon: "check", description: "本地文件读取、搜索、写入和编辑会自动执行；bash、联网请求和任务变更仍需确认。", summary: "减少日常编辑打断，同时保留终端和外部操作的审批。", capabilities: ["读取与搜索自动执行", "文件写入自动执行", "终端命令需要确认", "联网与外部变更需要确认"] },
      { id: "full_access", label: "完全访问", short: "完全", tone: "red", icon: "lock", description: "不弹权限审批，AI 可直接执行工具和终端命令。仅在完全信任的本地开发环境使用。", summary: "跳过全部工具审批，适合隔离且完全可信的开发环境。", capabilities: ["读取与搜索自动执行", "文件写入自动执行", "终端命令自动执行", "联网与外部变更自动执行"] }
    ];

    let state = { ...TWEAK_DEFAULTS };
    const pending = { mode: null };
    const $ = (selector) => document.querySelector(selector);

    function renderNavigation() {
      $("#navigation").innerHTML = navGroups.map(([title, items]) => `<div class="nav-group"><p class="nav-label">${title}</p>${items.map(([label, iconName]) => `<button type="button" class="nav-item ${label === "权限控制" ? "active" : ""}">${icon(iconName)}<span>${label}</span></button>`).join("")}</div>`).join("");
    }

    function render() {
      const active = modes.find((mode) => mode.id === state.mode) || modes[0];
      document.body.dataset.variant = state.variant;
      document.querySelectorAll("[data-set-variant]").forEach((button) => button.classList.toggle("active", button.dataset.setVariant === state.variant));
      $("#status").dataset.tone = active.tone;
      $("#status-label").textContent = active.label;
      $("#risk-section").hidden = active.id !== "full_access";

      $("#rows").innerHTML = modes.map((mode) => `<div class="permission-row ${mode.id === active.id ? "selected" : ""}" role="radio" aria-checked="${mode.id === active.id}" tabindex="0" data-mode="${mode.id}"><div class="row-copy"><div class="row-title">${icon(mode.icon)}<span>${mode.label}</span></div><p class="row-description">${mode.description}</p></div><span class="radio" aria-hidden="true"></span></div>`).join("");
      $("#segments").innerHTML = modes.map((mode) => `<button type="button" class="segment ${mode.id === active.id ? "selected" : ""}" data-mode="${mode.id}">${mode.short}</button>`).join("");
      $("#summary").innerHTML = `<h3>${active.label}</h3><p>${active.summary}</p><div class="capabilities">${active.capabilities.map((item) => `<div class="capability">${icon("check")}<span>${item}</span></div>`).join("")}</div>`;
      $("#levels").innerHTML = modes.map((mode, index) => `<div class="level ${mode.id === active.id ? "selected" : ""}" role="radio" aria-checked="${mode.id === active.id}" tabindex="0" data-mode="${mode.id}"><span class="level-index">0${index + 1}</span><div><h3>${mode.label}</h3><p>${mode.summary}</p></div><span class="radio" aria-hidden="true"></span></div>`).join("");
    }

    function showToast() {
      const toast = $(".toast");
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1500);
    }

    function chooseMode(mode) {
      if (mode === state.mode) return;
      if (mode === "full_access") {
        pending.mode = mode;
        $("#modal").classList.add("open");
        $("#cancel-full").focus();
        return;
      }
      state.mode = mode;
      render();
      showToast();
    }

    document.addEventListener("click", (event) => {
      const variantButton = event.target.closest("[data-set-variant]");
      if (variantButton) {
        state.variant = variantButton.dataset.setVariant;
        render();
        window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { variant: state.variant } }, "*");
        return;
      }
      const modeControl = event.target.closest("[data-mode]");
      if (modeControl) chooseMode(modeControl.dataset.mode);
    });

    document.addEventListener("keydown", (event) => {
      if ((event.key === "Enter" || event.key === " ") && event.target.matches("[data-mode]")) {
        event.preventDefault();
        chooseMode(event.target.dataset.mode);
      }
      if (event.key === "Escape") $("#modal").classList.remove("open");
    });

    $("#cancel-full").addEventListener("click", () => $("#modal").classList.remove("open"));
    $("#confirm-full").addEventListener("click", () => {
      state.mode = pending.mode || "full_access";
      pending.mode = null;
      $("#modal").classList.remove("open");
      render();
      showToast();
    });
    $("#modal").addEventListener("click", (event) => {
      if (event.target === $("#modal")) $("#modal").classList.remove("open");
    });

    window.addEventListener("message", (event) => {
      if (event.data?.type === "__activate_edit_mode") $(".prototype-switcher").hidden = false;
      if (event.data?.type === "__deactivate_edit_mode") $(".prototype-switcher").hidden = true;
    });
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");

    renderNavigation();
    render();
  </script>
</body>
</html>
